<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan Trip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Japan Trip Planner</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1b19;--mute:#7a736b;--line:#e6dfd5;--red:#c8102e;--red2:#fde8eb;
--act:#2b6cb0;--actbg:#e7f0fb;--meal:#c05621;--mealbg:#fdf0e4;--travel:#5a5f69;--travelbg:#eceff3;
--done:#2f855a;--donebg:#e3f3e8;--warn:#b7791f;--warnbg:#fff5d6;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--card:#201e1c;--ink:#f1ede7;--mute:#a59d93;--line:#36312c;--red:#ff4d5e;--red2:#3a1a1e;
--act:#7fb2f0;--actbg:#1b2a3d;--meal:#f6a560;--mealbg:#3a2616;--travel:#b5bcc8;--travelbg:#262a30;--done:#68d391;--donebg:#173323;--warn:#f6c453;--warnbg:#3a3015}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
#app{max-width:680px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=time]{padding:8px 6px}
input[type=checkbox]{width:auto}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 6px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.tt{display:flex;align-items:center;gap:8px}
.tt h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:none;font-size:22px;width:38px;height:38px;border-radius:10px;flex:0 0 auto}
.ib:active{background:var(--line)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 4px}
.strip::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:46px;text-align:center;padding:4px 0 3px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none}
.dchip small{display:block;font-size:11px;color:var(--mute)}
.dchip b{font-size:17px;display:block;line-height:1.1}
.dchip i{display:block;height:5px;width:5px;border-radius:3px;margin:2px auto 0;background:transparent}
.dchip i.p{background:var(--act)} .dchip i.d{background:var(--done)}
.dchip.on{background:var(--red);color:#fff;border-color:var(--red)} .dchip.on small{color:#fff}
.dchip.today{outline:2px solid var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.food.on{background:var(--meal);border-color:var(--meal);color:#fff}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;border:0;background:none;padding:7px 4px;border-radius:8px;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.dayhead{display:flex;align-items:flex-start;gap:8px;padding:8px 2px 2px}
.dayhead .dt{flex:1}
.dayhead .dt b{font-size:16px} .dayhead .dt small{display:block;color:var(--mute);font-size:12.5px}
.ctl{display:flex;gap:8px;align-items:center;padding-top:4px}
.ctl .seg{flex:0 0 auto}
.ctl .seg button{flex:0 0 auto;padding:6px 10px;overflow:visible}
.ctl .chips{flex:1}
.untimed{margin:8px 12px 0}
.untimed .lbl{margin-bottom:4px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
.tl{position:relative;margin:14px 12px 30px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.hr span{position:absolute;top:-8px;left:0;font-size:11px;color:var(--mute);background:var(--bg);padding-right:4px}
.tl-grid{position:absolute;top:0;bottom:0;left:44px;right:0}
.lanes{position:absolute;top:0;bottom:0;left:44px;right:0;pointer-events:none}
.blk{position:absolute;pointer-events:auto;border-radius:8px;padding:3px 28px 3px 6px;overflow:hidden;font-size:12.5px;border-left:4px solid;box-shadow:var(--shadow);cursor:pointer;scroll-margin-top:210px}
.t-act{background:var(--actbg);border-color:var(--act)}
.t-meal{background:var(--mealbg);border-color:var(--meal)}
.t-travel{background:var(--travelbg);border-color:var(--travel)}
.blk.s-done{background:var(--donebg);border-color:var(--done)}
.blk.s-skip{opacity:.45} .blk.s-skip .bt{text-decoration:line-through}
.blk.tent{border-style:dashed;border-width:1.5px 1.5px 1.5px 4px}
.blk.ghost{opacity:.38}
.blk.narrow{padding:3px 4px 22px;font-size:11.5px}
.blk.narrow .tick{top:auto;bottom:2px;width:20px;height:20px;line-height:16px;font-size:11px}
.blk .bt{font-weight:600;line-height:1.2;word-break:break-word}
.blk .bm{color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mute);background:var(--card);font-size:13px;line-height:20px;text-align:center;padding:0;color:#fff}
.s-done .tick,.tk.on,.sub.done .tk{background:var(--done);border-color:var(--done);color:#fff}
.nowline{position:absolute;left:38px;right:0;border-top:2px solid var(--red);z-index:5;pointer-events:none}
.nowline:before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:-18px 0 20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav a{flex:1;text-align:center;padding:6px 0 7px;color:var(--mute);text-decoration:none;font-size:11.5px}
nav a b{display:block;font-size:21px;font-weight:normal;line-height:1.3}
nav a.on{color:var(--red);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;font-size:32px;line-height:1;border:0;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:25}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .18s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row.sm{gap:6px;margin-top:4px}
.row.sm input{padding:5px 8px;font-size:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.grid3>select{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stack>*+*{margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:14.5px;text-align:center;text-decoration:none;display:inline-block}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 12px}
.card.hl{border-color:var(--done);background:var(--donebg)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sh span{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;background:var(--done);border-radius:3px}
.dtop.t-act{background:var(--actbg)} .dtop.t-meal{background:var(--mealbg)} .dtop.t-travel{background:var(--travelbg)}
.dtop{border-left:0}
.emo{flex:0 0 52px!important;text-align:center;font-size:22px;padding:4px}
.ttl{font-size:19px!important;font-weight:650}
.tog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.tog input{width:20px;height:20px}
.maplink{flex:0 0 auto!important;text-decoration:none;font-size:13px;white-space:nowrap}
.sub{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.sub .sb{flex:1;min-width:0}
.sub .sb>input{font-weight:600;padding:6px 8px}
.sub.done .sb>input{text-decoration:line-through;color:var(--mute)}
.tk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);background:var(--card);padding:0;font-size:15px;color:#fff;margin-top:3px}
.sbtn{display:flex;flex-direction:column;gap:2px}
.sbtn button{border:0;background:none;color:var(--mute);font-size:14px;padding:3px 6px}
form.row{margin-top:8px}
.stars button{border:0;background:none;font-size:26px;padding:0 2px;color:var(--line)}
.stars button.on{color:#f0b429}
.place{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.place.chosen{border-color:var(--meal);background:var(--mealbg)}
.place .star{flex:0 0 38px!important;font-size:20px;border:0;background:none}
.order{display:flex;align-items:center;gap:8px;margin-top:6px}
.order span{flex:0 0 96px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--mute);margin-right:4px;vertical-align:1px}
.badge.tent{background:var(--warnbg);color:var(--warn)}
.badge.meal{background:var(--mealbg);color:var(--meal)}
.list .li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.li .lb{flex:1;min-width:0;cursor:pointer}
.li .lb b{font-weight:600}
.li .lb small{display:block;color:var(--mute);font-size:12.5px}
.li.done .lb b{color:var(--mute)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:0 0 auto}
.ring .big{font-size:28px;font-weight:700;line-height:1}
.mday{padding:10px 12px;margin:0}
.mday+.mday{border-top:1px solid var(--line)}
.mday .mh{font-weight:600;margin-bottom:4px}
.mday .mh small{color:var(--mute);font-weight:400}
.mslot{display:flex;gap:6px;align-items:flex-start;padding:3px 0;font-size:14px}
.mslot .mk{flex:0 0 74px;color:var(--mute);font-size:13px;padding-top:2px}
.mslot .mv{flex:1;display:flex;flex-direction:column;gap:2px}
.mslot a{text-decoration:none}
.mslot .add{border:1px dashed var(--line);background:none;border-radius:8px;padding:2px 10px;color:var(--mute);font-size:13px;align-self:flex-start}
.frow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.frow:first-child{border-top:0}
.frow .fe{font-size:26px;flex:0 0 34px;text-align:center}
.frow .fb{flex:1;min-width:0}
.frow .fb small{color:var(--mute)}
.frow .fm{font-size:12px;color:var(--mute)}
.frow .fr{display:flex;align-items:center;gap:6px}
.av{font-size:15px;letter-spacing:-3px}
.pp{display:grid;grid-template-columns:52px 1fr 44px 36px;gap:6px;align-items:center;margin-bottom:6px}
.pp input[type=color]{padding:2px;height:38px}
.qr{display:flex;justify-content:center;padding:8px;background:#fff;border-radius:12px;margin-top:8px}
.qr svg{width:220px;height:220px}
.muted{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:16px 8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
details summary{cursor:pointer;color:var(--mute);font-size:14px;margin:6px 0}
.wishpick{margin-top:12px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <a href="#/day" data-tab="day"><b>📅</b>Days</a>
  <a href="#/bucket" data-tab="bucket"><b>✅</b>Bucket list</a>
  <a href="#/food" data-tab="food"><b>🍜</b>Food</a>
  <a href="#/more" data-tab="more"><b>👪</b>Family &amp; share</a>
</nav>
<div id="sheetwrap"></div>
<div id="toast"></div>
<script>
'use strict';
/* ====================== basics ====================== */
const KEY='jtp-data-v1', ME_KEY='jtp-me';
const QR_SRC='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const HP=56; // px per hour on the timeline
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _n=0;const uid=()=>Date.now().toString(36)+(_n++).toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>Date.now();
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const fromMin=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dparse=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd)};
const dfmt=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const dlabel=d=>{if(!d)return'Wishlist';const x=dparse(d);return`${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`};
const today=()=>dfmt(new Date());
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const TYPE={act:{label:'Activity',emoji:'📍'},meal:{label:'Meal',emoji:'🍽️'},travel:{label:'Travel',emoji:'✈️'}};
const KINDS=['Breakfast','Lunch','Dinner','Snack'];
const KIND_EMO={Breakfast:'🍳',Lunch:'🍱',Dinner:'🍽️',Snack:'🍡'};
const KIND_TIME={Breakfast:'08:00',Lunch:'12:30',Snack:'15:30',Dinner:'18:30'};
function kindFor(start){const m=toMin(start);if(m==null)return'Lunch';if(m<630)return'Breakfast';if(m<900)return'Lunch';if(m<1050)return'Snack';return'Dinner'}
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);

/* ====================== data ====================== */
const FOOD_SEED=[
['Takoyaki','章鱼烧','🐙','Osaka'],['Okonomiyaki','大阪烧','🥞','Osaka'],['Kushikatsu','串炸','🍢','Osaka'],
['Kobe beef','神户牛','🥩','Kobe'],['Wagyu yakiniku','和牛烧肉','🔥','Anywhere'],['Kaiten (conveyor) sushi','回转寿司','🍣','Anywhere'],
['Kaisen-don seafood bowl','海鲜丼','🐟','Hokkaido'],['Hokkaido crab','北海道蟹','🦀','Hokkaido'],['Uni (sea urchin)','海胆','🟠','Hokkaido'],
['Hokkaido scallops','北海道扇贝','🐚','Hokkaido'],['Miso ramen','味噌拉面','🍜','Sapporo'],['Soup curry','汤咖喱','🍛','Sapporo'],
['Genghis Khan lamb BBQ','成吉思汗烤肉','🍖','Sapporo'],['Hokkaido soft-serve','北海道软冰淇淋','🍦','Hokkaido'],['LeTAO cheesecake','LeTAO芝士蛋糕','🍰','Otaru'],
['Shiroi Koibito cookies','白色恋人','🍪','Sapporo'],['Royce chocolate','Royce生巧克力','🍫','Hokkaido'],['Matcha sweets','抹茶甜点','🍵','Kyoto'],
['Yatsuhashi','八桥饼','🥟','Kyoto'],['Tamagoyaki (Nishiki)','玉子烧','🍳','Kyoto'],['Yomogi mochi (Nakatanidou)','艾草麻糬','🍡','Nara'],
['Kakinoha sushi','柿叶寿司','🍃','Nara'],['Butterbeer','黄油啤酒','🍺','USJ'],['Tonkatsu','炸猪排','🐷','Anywhere'],
['Tempura','天妇罗','🍤','Anywhere'],['Udon','乌冬面','🍜','Anywhere'],['Gyoza','煎饺','🥟','Anywhere'],['Karaage','日式炸鸡','🍗','Anywhere'],
['Japanese curry rice','咖喱饭','🍛','Anywhere'],['Taiyaki','鲷鱼烧','🐟','Anywhere'],['Konbini onigiri','便利店饭团','🍙','Anywhere'],
['Melon pan','菠萝包','🍈','Anywhere'],['Strawberry daifuku','草莓大福','🍓','Anywhere'],['Christmas market sausage & hot chocolate','圣诞市集热巧克力','🌭','Sapporo']];

function newMeal(start,o={}){return{kind:o.kind||kindFor(start),places:(o.places||[]).map(p=>({id:uid(),name:p,area:'',price:'',note:'',chosen:false})),foods:o.foods||[],orders:{}}}
function newItem(o){
  const it=Object.assign({id:uid(),type:'act',day:'',start:'',end:'',title:'',emoji:'',who:[],status:'plan',tentative:false,place:'',area:'',notes:'',subs:[],actual:{},u:now()},o);
  if(!it.emoji)it.emoji=TYPE[it.type].emoji;
  if(it.type==='meal'&&!it.meal)it.meal=newMeal(it.start);
  return it;
}
const newSub=t=>({id:uid(),title:t,time:'',note:'',done:false});

function seed(){
  const t=now();
  const people=[['Me','🧔','#2b6cb0'],['Wife','👩','#d53f8c'],['Daughter','👧','#805ad5'],['Grandpa','👴','#2f855a'],['Grandma','👵','#c05621']]
    .map(([name,emoji,color])=>({id:uid(),name,emoji,color,u:t}));
  const foods=FOOD_SEED.map(([name,zh,emoji,region])=>({id:uid(),name,zh,emoji,region,tried:{},u:t}));
  // Starts blank on purpose: the real itinerary is loaded from a plan file, so nothing personal is in the public page.
  const items=[];
  const st=new Date(),en=new Date();en.setDate(en.getDate()+6);const days={};
  return {app:'japan-trip-planner',v:1,trip:{name:'My Japan Trip',start:dfmt(st),end:dfmt(en),u:0},people,foods,items,days,deleted:{},lastShared:0};
}

let S=load()||seed();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Could not save: '+e.message)}}
function touch(o){if(o)o.u=now();save()}
save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const getItem=id=>S.items.find(i=>i.id===id);
const getFood=id=>S.foods.find(f=>f.id===id);
const person=id=>S.people.find(p=>p.id===id);
function meId(){const m=ls.get(ME_KEY,'');return person(m)?m:(S.people[0]?.id||'')}
function tripDays(){const out=[];const x=dparse(S.trip.start),e=dparse(S.trip.end);let g=0;while(x<=e&&g++<120){out.push(dfmt(x));x.setDate(x.getDate()+1)}return out}
function defaultDay(){const d=tripDays(),t=today();return d.includes(t)?t:d[0]}
function remove(id){S.deleted[id]=now();S.items=S.items.filter(i=>i.id!==id);save()}

function whoMini(ids){

  if(!ps.length)return'<span class="muted">All</span>';
  return '<span class="av">'+ps.slice(0,5).map(p=>esc(p.emoji)).join('')+(ps.length>5?'+'+(ps.length-5):'')+'</span>';
}
function personChips(selected,act,allLabel='👪 Everyone'){

    S.people.map(p=>`<button class="chip ${selected.includes(p.id)?'on':''}" data-a="${act}" data-v="${p.id}">${esc(p.emoji)} ${esc(p.name)}</button>`).join('');

/* ====================== DAY VIEW ====================== */
function layoutLanes(list){
  list.sort((a,b)=>a._s-b._s||(b._e-b._s)-(a._e-a._s));
  let cluster=[],end=-1;const out=[];
  const flush=()=>{const cols=[];for(const it of cluster){let c=cols.findIndex(e=>e<=it._s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it._e;it._c=c}for(const it of cluster)it._n=cols.length;out.push(...cluster);cluster=[];end=-1};
  for(const it of list){if(cluster.length&&it._s>=end)flush();cluster.push(it);end=Math.max(end,it._e)}
  if(cluster.length)flush();return out;
}
function viewDay(date){
  const days=tripDays();if(!days.includes(date))date=curDay&&days.includes(curDay)?curDay:defaultDay();
  curDay=date;
  const di=S.days[date]||{};
  const all=S.items.filter(i=>i.day===date&&visible(i));
  const actual=mode==='actual';
  const timed=[],untimed=[];
  for(const i of all){
    const st=actual&&i.status==='done'&&i.actual?.start?i.actual.start:i.start;
    const en=actual&&i.status==='done'&&i.actual?.end?i.actual.end:i.end;
    if(!st){untimed.push(i);continue}
    const s=toMin(st);let e=toMin(en);if(e==null||e<=s)e=s+60;
    timed.push(Object.assign(Object.create(null),{it:i,_s:s,_e:e}));
  }
  let sh=7,eh=22;for(const t of timed){sh=Math.min(sh,Math.floor(t._s/60));eh=Math.max(eh,Math.ceil(t._e/60))}
  eh=Math.min(eh,24);
  layoutLanes(timed);
  const strip=days.map(d=>{const its=S.items.filter(i=>i.day===d&&visible(i)&&i.type!=='travel');const dd=its.length&&its.every(i=>i.status!=='plan');const x=dparse(d);
    return `<a href="#/day/${d}" id="dc-${d}" class="dchip ${d===date?'on':''} ${d===today()?'today':''}"><small>${DOW[x.getDay()]}</small><b>${x.getDate()}</b><i class="${its.length?(dd?'d':'p'):''}"></i></a>`}).join('');
  const nPlan=all.filter(i=>i.type!=='travel').length,nDone=all.filter(i=>i.status==='done'&&i.type!=='travel').length;
  let hours='';for(let h=sh;h<=eh;h++)hours+=`<div class="hr" style="top:${(h-sh)*HP}px"><span>${String(h%24).padStart(2,'0')}:00</span></div>`;
  const blocks=timed.map(t=>{const i=t.it;const top=(t._s-sh*60)/60*HP,h=Math.max(26,(t._e-t._s)/60*HP-2);
    const ghost=actual&&i.status!=='done'&&i.type!=='travel';
    const subs=i.subs?.length?` · ${i.subs.filter(s=>s.done).length}/${i.subs.length}`:'';
    const mealInfo=i.type==='meal'?(i.meal.places.find(p=>p.chosen)?.name||''):'';
    const w=100/t._n;
    return `<div class="blk t-${i.type} s-${i.status} ${i.tentative?'tent':''} ${ghost?'ghost':''} ${t._n>2?'narrow':''}" data-a="open" data-id="${i.id}" style="top:${top}px;height:${h}px;left:calc(${t._c*w}% + 2px);width:calc(${w}% - 4px)">
      <div class="bt">${esc(i.emoji)} ${esc(i.title)}</div>
      <div class="bm">${fromMin(t._s)}–${fromMin(t._e)}${subs} ${whoMini(i.who)}${mealInfo?' · '+esc(mealInfo):''}</div>
      ${i.type!=='travel'?`<button class="tick" data-a="quickdone" data-id="${i.id}">${i.status==='done'?'✓':''}</button>`:''}</div>`}).join('');
  let nowl='';if(date===today()){const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m>=sh*60&&m<=eh*60)nowl=`<div class="nowline" style="top:${(m-sh*60)/60*HP}px"></div>`}
  return `<div class="top">
    <div class="tt"><h1>🇯🇵 ${esc(S.trip.name)}</h1><button class="ib" data-a="edit-day" title="Edit day">✏️</button></div>
    <div class="strip" id="strip">${strip}</div>
    <div class="dayhead"><div class="dt"><b>${esc(dlabel(date))} · ${esc(di.title||'')}</b><small>${esc(di.note||'')}${di.note?' · ':''}${nDone}/${nPlan} done</small></div></div>
    <div class="ctl"><div class="seg"><button data-a="mode" data-v="plan" class="${!actual?'on':''}">Plan</button><button data-a="mode" data-v="actual" class="${actual?'on':''}">Actual</button></div>
      <div class="chips">${personChips(pf?[pf]:[],'pf','👪 All')}</div></div>
  </div>
  ${!S.items.length?`<div class="card" style="text-align:center"><div style="font-size:40px">🗾</div><h2>Welcome!</h2>
    <p class="muted">Load the plan file the family sent you (WhatsApp/email → save it), or start adding your own plans with ＋.</p>
    <input type="file" id="importfile" accept=".json,application/json,text/plain" hidden>
    <button class="btn pri full" data-a="import">📥 Load a plan file</button></div>`:''}
  ${untimed.length?`<div class="untimed"><div class="lbl">Anytime today</div><div class="chips wrap">${untimed.map(i=>`<button class="chip" data-a="open" data-id="${i.id}">${i.status==='done'?'✅':esc(i.emoji)} ${esc(i.title)}</button>`).join('')}</div></div>`:''}
  <div class="tl" style="height:${(eh-sh)*HP+10}px">${hours}<div class="tl-grid" data-a="tl-tap" data-sh="${sh}"></div><div class="lanes">${blocks}</div>${nowl}</div>
  <div class="hint">${actual?'Actual mode: faded = planned but not done yet. ＋ logs what you did.':'Tap an empty time to add · tap a block for details · ○ to tick off'}</div>
  <button class="fab" data-a="qa">＋</button>`;
}

/* ====================== BUCKET LIST ====================== */
function viewBucket(){
  const acts=S.items.filter(i=>i.type!=='travel'&&visible(i));
  const done=acts.filter(i=>i.status==='done'),wish=acts.filter(i=>!i.day&&i.status==='plan'),todo=acts.filter(i=>i.day&&i.status==='plan'),skip=acts.filter(i=>i.status==='skip');
  const total=acts.filter(i=>i.status==='done'||(i.status==='plan'&&!i.tentative)).length,pct=total?done.length/total:0;const C=2*Math.PI*34;
  const row=i=>`<div class="li ${i.status==='done'?'done':''}"><button class="tk ${i.status==='done'?'on':''}" data-a="quickdone" data-id="${i.id}">${i.status==='done'?'✓':''}</button>
    <div class="lb" data-a="open" data-id="${i.id}"><b>${esc(i.emoji)} ${esc(i.title)}</b><small>${i.tentative?'<span class="badge tent">option</span>':''}${i.type==='meal'?'<span class="badge meal">meal</span>':''}${i.day?esc(dlabel(i.day))+(i.start?' '+i.start:''):esc(i.area||'')} ${i.who.length?whoMini(i.who):''}${i.subs?.length?` · ${i.subs.filter(s=>s.done).length}/${i.subs.length} inside`:''}${i.actual?.rating?' · '+'★'.repeat(i.actual.rating):''}</small></div></div>`;
  const byArea={};for(const i of wish)(byArea[i.area||'Anywhere']??=[]).push(i);
  const todoSorted=todo.sort((a,b)=>(a.day+a.start).localeCompare(b.day+b.start));
  return `<div class="top"><div class="tt"><h1>✅ Bucket list</h1></div><div class="chips">${personChips(pf?[pf]:[],'pf','👪 All')}</div></div>
  <div class="card ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="42" cy="42" r="34" fill="none" stroke="var(--done)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 42 42)"/></svg>
    <div><div class="big">${done.length}<span class="muted" style="font-size:16px"> / ${total}</span></div><div>ticked off${pf?' for '+esc(person(pf)?.name):''} 🎉</div><div class="muted">${wish.length} on the wishlist · ${todo.length} planned</div></div></div>
  <div class="card"><div class="sh"><h3>⭐ Wishlist – not scheduled yet</h3><span>${wish.length}</span></div>
    <form class="row" data-form="wish-add"><input name="t" placeholder="Add something we'd love to do…" autocomplete="off"><button class="btn pri" style="flex:0 0 auto">Add</button></form>
    ${Object.entries(byArea).map(([a,l])=>`<div class="lbl">${esc(a)}</div><div class="list">${l.map(row).join('')}</div>`).join('')||'<div class="empty">Nothing waiting — everything is scheduled!</div>'}
    <div class="muted" style="margin-top:6px">Tip: open an item and pick a day to schedule it, or tap an empty slot on a day and choose it from the wishlist.</div></div>
  <div class="card"><div class="sh"><h3>📋 Still to do</h3><span>${todo.length}</span></div><div class="list">${todoSorted.map(row).join('')||'<div class="empty">All done!</div>'}</div></div>
  <div class="card"><div class="sh"><h3>🎉 Done</h3><span>${done.length}</span></div><div class="list">${done.sort((a,b)=>((b.day||'')+(b.start||'')).localeCompare((a.day||'')+(a.start||''))).map(row).join('')||'<div class="empty">Nothing ticked off yet — go have fun!</div>'}</div></div>
  ${skip.length?`<div class="card"><details><summary>⏭️ Skipped (${skip.length})</summary><div class="list">${skip.map(row).join('')}</div></details></div>`:''}`;
}

/* ====================== FOOD ====================== */
function mealsForFood(fid){return S.items.filter(i=>i.type==='meal'&&i.status!=='skip'&&i.meal.foods.includes(fid)).sort((a,b)=>(a.day+a.start).localeCompare(b.day+b.start))}

          <button class="add" data-a="qa-meal" data-day="${d}" data-kind="${k}">＋ ${ms.length?'another (different group)':'add '+k.toLowerCase()}</button></div></div>`}).join('')}

      <div class="card" style="padding:0">${rows}</div>`;
  }else{
    const me=meId();

    const nTried=st.filter(x=>x.tried.length).length,nPlanned=st.filter(x=>x.meals.length).length;
    const flt={all:()=>true,todo:x=>!x.meals.length&&!x.tried.length,planned:x=>x.meals.length&&!x.tried.length,tried:x=>x.tried.length}[foodFilter]||(()=>true);
    const list=st.filter(flt);
    const regions={};for(const x of list)(regions[x.f.region||'Anywhere']??=[]).push(x);
    body=`<div class="card"><div class="row" style="align-items:stretch;text-align:center">
        <div><div style="font-size:24px;font-weight:700">${nTried}</div><div class="muted">tried</div></div>
        <div><div style="font-size:24px;font-weight:700">${nPlanned}</div><div class="muted">in a meal plan</div></div>

function loadScript(src){return new Promise((res,rej)=>{if(window.qrcode)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function drawQR(){

const exportJSON=()=>JSON.stringify({app:'japan-trip-planner',v:1,exportedAt:now(),data:S});
const fname=()=>'japan-trip-plan-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
function download(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function shareFile(){
  const text=exportJSON();const file=new File([text],fname(),{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Japan trip plan',text:'Latest Japan trip plan – open the planner → Family & share → Import'});markShared();return}}
  catch(e){if(e.name==='AbortError')return}
  download(text,fname());markShared();toast('Saved to Downloads — attach it in WhatsApp/email');
}
function markShared(){S.lastShared=now();save();render()}
async function b64compress(str){const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));const u=new Uint8Array(await new Response(cs).arrayBuffer());let b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function b64decompress(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
async function shareLink(){
  try{const z=await b64compress(JSON.stringify(S));const url=location.origin+location.pathname+'#import='+z;
    if(navigator.share){try{await navigator.share({title:'Japan trip plan',url});markShared();return}catch(e){if(e.name==='AbortError')return}}
    await navigator.clipboard.writeText(url);markShared();toast(`Link copied (${Math.round(url.length/1024)} KB) — paste it to family`)}
  catch(e){toast('Could not make link: '+e.message)}
}
function parseIncoming(text){const o=JSON.parse(text);const d=o.data||o;if(!d.items||!d.people)throw new Error('Not a trip plan file');return d}
function askImport(d){
  if(!S.items.length){S=d;S.deleted=S.deleted||{};save();curDay=null;location.hash='#/day';render();toast(`📥 Plan loaded: ${d.items.length} items`);return}
  openSheet(`<h2>📥 Import plan</h2><div class="muted">${d.items.length} items · ${d.foods?.length||0} foods · ${d.people.length} people</div>
    <p><b>Merge</b> keeps the newest version of every item from both phones (recommended). <b>Replace</b> throws away what's on this phone.</p>
    <div class="btns"><button class="btn" data-a="close">Cancel</button><button class="btn" data-a="imp-replace">Replace all</button><button class="btn pri" style="flex:1" data-a="imp-merge">Merge</button></div>`);
  pendingImport=d;
}
let pendingImport=null;
function mergeData(inc){
  const del=Object.assign({},S.deleted);for(const[k,v]of Object.entries(inc.deleted||{}))del[k]=Math.max(del[k]||0,v);
  const mergeArr=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));for(const x of b||[]){const c=m.get(x.id);if(!c||(x.u||0)>(c.u||0))m.set(x.id,x)}return[...m.values()].filter(x=>!(del[x.id]>=(x.u||0)))};
  const n0=S.items.length;
  S.items=mergeArr(S.items,inc.items);S.foods=mergeArr(S.foods,inc.foods);S.people=mergeArr(S.people,inc.people);
  for(const[d,v]of Object.entries(inc.days||{})){const c=S.days[d];if(!c||(v.u||0)>(c.u||0))S.days[d]=v}
  if(inc.trip&&(inc.trip.u||0)>(S.trip.u||0))S.trip=inc.trip;
  S.deleted=del;save();return S.items.length-n0;
}

document.addEventListener('change',e=>{
  const el=e.target,ds=el.dataset;
  if(el.id==='qa-start'&&qa){qaSync();if(qa.start&&(!qa.end||toMin(qa.end)<=toMin(qa.start))){qa.end=fromMin(toMin(qa.start)+60);$('#qa-end').value=qa.end}return}
  if(el.id==='importfile'){const f=el.files[0];if(!f)return;f.text().then(t=>askImport(parseIncoming(t))).catch(err=>toast('Import failed: '+err.message));el.value='';return}
  if(ds.f){const it=getItem(curItemId);if(!it)return;const v=el.type==='checkbox'?el.checked:el.value;setPath(it,ds.f,v);
    if(ds.f==='start'&&v&&(!it.end||toMin(it.end)<=toMin(v)))it.end=fromMin(toMin(v)+60);
    if(ds.f==='type'&&v==='meal'&&!it.meal)it.meal=newMeal(it.start);
    if(ds.f==='start'&&it.type==='meal'&&v)it.meal.kind=kindFor(v);
    touch(it);if(['start','day','type','tentative'].includes(ds.f))render();return}
  if(ds.sf){const it=getItem(curItemId);const s=it.subs.find(x=>x.id===ds.sid);s[ds.sf]=el.value;touch(it);return}
  if(ds.pf){const it=getItem(curItemId);const p=it.meal.places.find(x=>x.id===ds.pid);p[ds.pf]=el.value;touch(it);return}
  if(ds.of){const it=getItem(curItemId);it.meal.orders[ds.of]=el.value;touch(it);return}
  if(ds.ff){const f=getFood(curFoodId);f[ds.ff]=el.value;touch(f);render();return}
  if(ds.pp){const p=person(ds.pid);p[ds.pp]=el.value;touch(p);return}
  if(ds.tf){S.trip[ds.tf]=el.value;touch(S.trip);return}
});
document.addEventListener('submit',e=>{
  const form=e.target,kind=form.dataset.form;if(!kind)return;e.preventDefault();const v=form.t.value.trim();if(!v)return;
  if(kind==='sub-add'){const it=getItem(curItemId);it.subs=it.subs||[];it.subs.push(newSub(v));touch(it)}
  if(kind==='place-add'){const it=getItem(curItemId);it.meal.places.push({id:uid(),name:v,area:'',price:'',note:'',chosen:it.meal.places.length===0});touch(it)}
  if(kind==='food-new'){const f={id:uid(),name:v,zh:'',emoji:'🍽️',region:'Anywhere',tried:{},u:now()};S.foods.push(f);const it=location.hash.startsWith('#/item/')&&getItem(curItemId);if(it&&it.meal){it.meal.foods.push(f.id);touch(it)}else save()}
  if(kind==='wish-add'){S.items.push(newItem({title:v,who:pf?[pf]:[]}));save();toast('⭐ Added to wishlist')}
  if(kind==='person-add'){const cols=['#2b6cb0','#d53f8c','#805ad5','#2f855a','#c05621','#b7791f','#319795','#e53e3e'];S.people.push({id:uid(),name:v,emoji:'🙂',color:cols[S.people.length%cols.length],u:now()});save()}
  render();
  const again=document.querySelector(`form[data-form="${kind}"] input[name=t]`);if(again&&kind!=='food-new')again.focus();
});

/* ====================== router ====================== */
function render(){
  const p=location.hash.slice(1).split('/').filter(Boolean);const key=p.join('/');
  const same=key===lastRoute;const y=window.scrollY;let tab='day',html;
  if(p[0]==='item'){const it=getItem(p[1]);html=it?viewItem(it):'<div class="empty">That item was deleted. <a href="#/day">Back</a></div>'}
  else if(p[0]==='bucket'){html=viewBucket();tab='bucket'}
  else if(p[0]==='food'){html=viewFood();tab='food'}
  else if(p[0]==='more'){html=viewMore();tab='more'}
  else html=viewDay(p[1]);
  $('#app').innerHTML=html;
  document.querySelectorAll('#nav a').forEach(a=>{a.classList.toggle('on',a.dataset.tab===tab);if(a.dataset.tab==='day')a.href='#/day/'+(curDay||'')});
  if(same)window.scrollTo(0,y);
  else if(tab==='day'&&p[0]!=='item'){
    $('#dc-'+curDay)?.scrollIntoView({inline:'center',block:'nearest'});
    if(scrolledDay!==curDay){scrolledDay=curDay;const n=$('.nowline'),f=$('.blk');window.scrollTo(0,0);if(S.items.length)(n||f)?.scrollIntoView({block:'start'})}
  }else window.scrollTo(0,0);
  if(tab==='more')drawQR();
  lastRoute=key;
}
window.addEventListener('hashchange',async()=>{
  if(location.hash.startsWith('#import=')){await handleImportHash();return}
  closeSheet();render();
});
async function handleImportHash(){
  const z=location.hash.slice(8);history.replaceState(null,'',location.pathname+'#/day');
  render();
  try{askImport(parseIncoming(await b64decompress(z)))}catch(e){toast('That link could not be read: '+e.message)}
}
if(location.hash.startsWith('#import='))handleImportHash();else render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
